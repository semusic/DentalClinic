name: DentalClinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JUnit 4
        run: |
          mkdir -p .ci/lib
          curl -fL -o .ci/lib/junit-4.13.2.jar \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fL -o .ci/lib/hamcrest-core-1.3.jar \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile portable unit tests
        run: |
          mkdir -p .ci/classes

          javac \
            -cp ".ci/lib/junit-4.13.2.jar:.ci/lib/hamcrest-core-1.3.jar" \
            -d .ci/classes \
            src/java/com/dentalclinic/pattern/state/*.java \
            src/java/com/dentalclinic/pattern/observer/NotificationObserver.java \
            src/java/com/dentalclinic/pattern/observer/NotificationSubject.java \
            src/java/com/dentalclinic/model/Notification.java \
            src/java/com/dentalclinic/service/QrTokenService.java \
            src/java/com/dentalclinic/util/PasswordHasher.java \
            test/com/dentalclinic/pattern/state/AppointmentStateTest.java \
            test/com/dentalclinic/pattern/observer/NotificationSubjectTest.java \
            test/com/dentalclinic/service/QrTokenServiceTest.java \
            test/com/dentalclinic/util/PasswordHasherTest.java

      - name: Run portable unit tests
        run: |
          java -cp ".ci/classes:.ci/lib/junit-4.13.2.jar:.ci/lib/hamcrest-core-1.3.jar" \
            org.junit.runner.JUnitCore \
            com.dentalclinic.pattern.state.AppointmentStateTest \
            com.dentalclinic.pattern.observer.NotificationSubjectTest \
            com.dentalclinic.service.QrTokenServiceTest \
            com.dentalclinic.util.PasswordHasherTest
